<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#111a3a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="96" fill="#94a3b8" font-size="20" letter-spacing="4">HOLA, SOY</text>
    <text x="70" y="160" fill="#ffffff" font-size="62" font-weight="700">Adrián Siles Pérez</text>
    <rect x="72" y="180" width="120" height="5" rx="2.5" fill="url(#accent)">
      <animate attributeName="width" values="40;220;40" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="72" y="226" fill="#cbd5e1" font-size="24">Developer · QA de software · Automatización</text>
    <g font-size="16" font-weight="600">
      <rect x="72" y="248" width="92" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="118" y="268" fill="#7dd3fc" text-anchor="middle">Python</text>
      <rect x="176" y="248" width="92" height="30" rx="15" fill="#f87171" fill-opacity="0.15" stroke="#f87171" stroke-opacity="0.5"/>
      <text x="222" y="268" fill="#fca5a5" text-anchor="middle">Laravel</text>
      <rect x="280" y="248" width="116" height="30" rx="15" fill="#facc15" fill-opacity="0.15" stroke="#facc15" stroke-opacity="0.5"/>
      <text x="338" y="268" fill="#fde68a" text-anchor="middle">JavaScript</text>
      <rect x="408" y="248" width="104" height="30" rx="15" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="460" y="268" fill="#c4b5fd" text-anchor="middle">Power BI</text>
    </g>
  </g>
  <g transform="translate(860 70)" font-family="'Fira Code', Consolas, monospace" font-size="15">
    <rect width="280" height="170" rx="12" fill="#0b1020" fill-opacity="0.85" stroke="#334155"/>
    <circle cx="20" cy="18" r="5" fill="#f87171"/><circle cx="38" cy="18" r="5" fill="#facc15"/><circle cx="56" cy="18" r="5" fill="#4ade80"/>
    <text x="20" y="58" fill="#c084fc">class <tspan fill="#7dd3fc">Adrian</tspan><tspan fill="#e2e8f0">:</tspan></text>
    <text x="40" y="84" fill="#e2e8f0">stack = <tspan fill="#86efac">"Python"</tspan></text>
    <text x="40" y="108" fill="#e2e8f0">rol = <tspan fill="#86efac">"QA &amp; Dev"</tspan></text>
    <text x="40" y="132" fill="#e2e8f0">base = <tspan fill="#86efac">"Almería"</tspan></text>
    <rect x="40" y="142" width="9" height="16" fill="#38bdf8"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
